services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      target: development
    environment:
      VITE_PORT: 5173
      VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:3000/api}
    command: ["./node_modules/.bin/vite", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  frontend-node-modules:
